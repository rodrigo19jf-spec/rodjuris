# Produção: app + Caddy (HTTPS automático com Let's Encrypt).
services:
  app:
    build: ..
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      - TZ_APP=America/Sao_Paulo
    volumes:
      - ../dados:/app/dados
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMINIO=${DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  caddy_data:
  caddy_config:
